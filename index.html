<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ancient Experiment 2.2</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=MedievalSharp&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="dust"></div>

  <div class="ui">
    <header>
      <div class="title">
        <span class="rune">✦</span>
        <h1>ANCIENT EXPERIMENT</h1>
        <span class="version">II.II</span>
        <span class="rune">✦</span>
      </div>
      <div class="score-box">
        <span>Essence</span>
        <strong id="score">0</strong>
      </div>
    </header>

    <main>
      <section class="story">
        <p id="story-text">You stand before the sealed Chamber of Trials. The ancient runes await your touch...</p>
      </section>

      <section class="game-area">
        <div class="artifact" id="artifact">
          <div class="crystal" id="crystal">◆</div>
          <div class="ring ring1"></div>
          <div class="ring ring2"></div>
          <div class="ring ring3"></div>
        </div>

        <div class="runes" id="runes">
          <button class="rune-btn" data-power="fire">🔥</button>
          <button class="rune-btn" data-power="water">💧</button>
          <button class="rune-btn" data-power="earth">🌍</button>
          <button class="rune-btn" data-power="air">🌪️</button>
          <button class="rune-btn" data-power="spirit">✨</button>
        </div>

        <div class="actions">
          <button class="action-btn" id="channel-btn">Channel Power</button>
          <button class="action-btn secondary" id="reset-btn">Reset Chamber</button>
        </div>
      </section>

      <section class="log">
        <div class="log-title">Chronicle of the Experiment</div>
        <div class="log-body" id="log"></div>
      </section>
    </main>

    <footer>
      <span>The Lost Temple · Experiment 2.2</span>
      <span id="level">Trial 1</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
