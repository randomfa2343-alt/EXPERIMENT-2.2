<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>TAP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0c;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
    }
    #c {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #0a0a0c;
    }
    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    #score {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(48px, 12vw, 72px);
      font-weight: 200;
      letter-spacing: -0.04em;
      color: rgba(255,255,255,0.9);
      transition: transform 0.15s ease;
    }
    #score.pop { transform: translateX(-50%) scale(1.15); }
    #best {
      position: absolute;
      top: 8%;
      right: 6%;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.08em;
    }
    #hint {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: opacity 0.4s;
    }
    #hint.hide { opacity: 0; }
    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,12,0.92);
      z-index: 10;
      pointer-events: auto;
    }
    #overlay.show { display: flex; }
    #overlay h1 {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 300;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
      color: #fff;
    }
    #overlay .sub {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 28px;
      letter-spacing: 0.06em;
    }
    #overlay .final {
      font-size: clamp(56px, 14vw, 80px);
      font-weight: 200;
      margin-bottom: 6px;
    }
    #overlay .best-line {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 36px;
      letter-spacing: 0.1em;
    }
    #retry {
      padding: 14px 40px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      cursor: pointer;
      transition: all 0.2s;
    }
    #retry:hover, #retry:active {
      background: #fff;
      color: #0a0a0c;
      border-color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="score">0</div>
    <div id="best">BEST 0</div>
    <div id="hint">TAP</div>
  </div>
  <div id="overlay">
    <h1>GAME OVER</h1>
    <div class="sub">score</div>
    <div class="final" id="final">0</div>
    <div class="best-line" id="best-line">best 0</div>
    <button id="retry">AGAIN</button>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const hintEl = document.getElementById('hint');
    const overlay = document.getElementById('overlay');
    const finalEl = document.getElementById('final');
    const bestLine = document.getElementById('best-line');

    let W, H, dpr;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Audio
    let actx = null;
    function audio() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function beep(freq, dur, type = 'sine', vol = 0.08) {
      if (!actx) return;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g);
      g.connect(actx.destination);
      const t = actx.currentTime;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t);
      o.stop(t + dur);
    }

    // State
    let state = 'ready'; // ready | play | dead
    let score = 0;
    let best = +localStorage.getItem('tapBest') || 0;
    bestEl.textContent = 'BEST ' + best;

    const GRAVITY = 0.38;
    const JUMP = -8.2;
    const PIPE_W = 56;
    const PIPE_GAP = 150;
    const PIPE_SPEED = 2.6;
    const BIRD_R = 14;

    let bird, pipes, particles, frame, started;

    function reset() {
      bird = {
        x: W * 0.28,
        y: H * 0.45,
        vy: 0,
        rot: 0
      };
      pipes = [];
      particles = [];
      score = 0;
      frame = 0;
      started = false;
      state = 'ready';
      scoreEl.textContent = '0';
      hintEl.classList.remove('hide');
      overlay.classList.remove('show');
      // first pipes
      for (let i = 0; i < 4; i++) spawnPipe(W + 120 + i * 220);
    }

    function spawnPipe(x) {
      const minY = 100;
      const maxY = H - 100 - PIPE_GAP;
      const top = minY + Math.random() * (maxY - minY);
      pipes.push({
        x,
        top,
        bottom: top + PIPE_GAP,
        passed: false
      });
    }

    function jump() {
      audio();
      if (state === 'dead') return;
      if (state === 'ready') {
        state = 'play';
        started = true;
        hintEl.classList.add('hide');
      }
      bird.vy = JUMP;
      beep(660, 0.07, 'sine', 0.07);
      // jump particles
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: bird.x, y: bird.y + 8,
          vx: (Math.random() - 0.5) * 3,
          vy: Math.random() * 2 + 1,
          life: 20 + Math.random() * 15,
          max: 35,
          size: 2 + Math.random() * 2
        });
      }
    }

    function die() {
      if (state === 'dead') return;
      state = 'dead';
      beep(180, 0.25, 'sawtooth', 0.1);
      setTimeout(() => beep(120, 0.3, 'sawtooth', 0.08), 80);
      // burst
      for (let i = 0; i < 24; i++) {
        particles.push({
          x: bird.x, y: bird.y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          life: 30 + Math.random() * 30,
          max: 60,
          size: 2 + Math.random() * 3
        });
      }
      if (score > best) {
        best = score;
        localStorage.setItem('tapBest', best);
        bestEl.textContent = 'BEST ' + best;
      }
      finalEl.textContent = score;
      bestLine.textContent = 'best ' + best;
      setTimeout(() => overlay.classList.add('show'), 600);
    }

    // Input – one button
    function onTap(e) {
      e.preventDefault();
      jump();
    }
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        jump();
      }
    });
    canvas.addEventListener('mousedown', onTap);
    canvas.addEventListener('touchstart', onTap, { passive: false });
    document.getElementById('retry').addEventListener('click', () => {
      reset();
    });

    function update() {
      if (state !== 'play') {
        // idle float when ready
        if (state === 'ready') {
          bird.y = H * 0.45 + Math.sin(frame * 0.05) * 8;
        }
        // particles still move when dead
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.life--;
          p.vx *= 0.97; p.vy *= 0.97;
        });
        particles = particles.filter(p => p.life > 0);
        frame++;
        return;
      }

      // Bird physics
      bird.vy += GRAVITY;
      bird.y += bird.vy;
      bird.rot = Math.max(-0.5, Math.min(0.8, bird.vy * 0.06));

      // Floor / ceiling
      if (bird.y + BIRD_R > H - 20 || bird.y - BIRD_R < 0) {
        die();
        return;
      }

      // Pipes
      pipes.forEach(p => {
        p.x -= PIPE_SPEED;

        // score
        if (!p.passed && p.x + PIPE_W < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          scoreEl.classList.add('pop');
          setTimeout(() => scoreEl.classList.remove('pop'), 150);
          beep(880 + score * 20, 0.08, 'sine', 0.06);
        }

        // collision
        if (bird.x + BIRD_R > p.x && bird.x - BIRD_R < p.x + PIPE_W) {
          if (bird.y - BIRD_R < p.top || bird.y + BIRD_R > p.bottom) {
            die();
          }
        }
      });

      // recycle pipes
      if (pipes.length && pipes[0].x < -PIPE_W - 20) {
        pipes.shift();
        const last = pipes[pipes.length - 1];
        spawnPipe(last.x + 220);
      }

      // particles
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.life--;
        p.vx *= 0.97; p.vy *= 0.97;
      });
      particles = particles.filter(p => p.life > 0);

      frame++;
    }

    function draw() {
      // bg
      ctx.fillStyle = '#0a0a0c';
      ctx.fillRect(0, 0, W, H);

      // subtle grid lines
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // pipes
      pipes.forEach(p => {
        // top
        ctx.fillStyle = '#1a1a1f';
        ctx.fillRect(p.x, 0, PIPE_W, p.top);
        // bottom
        ctx.fillRect(p.x, p.bottom, PIPE_W, H - p.bottom);
        // edge highlight
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(p.x, p.top - 4, PIPE_W, 4);
        ctx.fillRect(p.x, p.bottom, PIPE_W, 4);
      });

      // particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life / p.max;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // bird
      if (state !== 'dead' || particles.length > 10) {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rot);
        // glow
        ctx.shadowColor = 'rgba(255,255,255,0.5)';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
        ctx.fill();
        // eye
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#0a0a0c';
        ctx.beginPath();
        ctx.arc(5, -3, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // floor line
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, H - 18);
      ctx.lineTo(W, H - 18);
      ctx.stroke();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    reset();
    loop();
  </script>
</body>
</html>
