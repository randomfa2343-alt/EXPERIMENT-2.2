<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Galaxy Attack · Experiment 2.2</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
      <h1>GALAXY ATTACK</h1>
      <p class="subtitle">EXPERIMENT 2.2</p>
      <p class="hint">Arrow keys / A-D to move · Space / Click to shoot</p>
      <button id="start-btn" class="btn">▶ START MISSION</button>
      <p class="highscore">Best Score: <span id="best-score">0</span></p>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div>SCORE <span id="score">0</span></div>
        <div>WAVE <span id="wave">1</span></div>
      </div>
      <div class="hud-right">
        <div id="lives">❤️❤️❤️</div>
      </div>
    </div>

    <!-- Game Over -->
    <div id="gameover-screen" class="screen hidden">
      <h1>MISSION FAILED</h1>
      <p class="final-score">Score: <span id="final-score">0</span></p>
      <p class="final-wave">Waves survived: <span id="final-wave">0</span></p>
      <button id="restart-btn" class="btn">↺ TRY AGAIN</button>
    </div>

    <!-- Mobile controls -->
    <div id="mobile-controls" class="hidden">
      <button id="left-btn">◀</button>
      <button id="shoot-btn">🔥</button>
      <button id="right-btn">▶</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
