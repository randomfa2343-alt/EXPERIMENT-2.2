<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Galaxy Attack</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #050510;
      cursor: crosshair;
    }
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
      text-shadow: 0 1px 3px #000;
    }
    #hud span { color: #00f0ff; }
    #lives { font-size: 18px; letter-spacing: 4px; }
    #mobile {
      position: fixed;
      bottom: 20px; left: 0; right: 0;
      display: none;
      justify-content: center;
      gap: 24px;
      z-index: 10;
    }
    #mobile button {
      width: 70px; height: 70px;
      font-size: 28px;
      background: rgba(0,240,255,0.12);
      border: 2px solid rgba(0,240,255,0.45);
      color: #00f0ff;
      border-radius: 50%;
      cursor: pointer;
    }
    #mobile button:active { background: rgba(0,240,255,0.35); }
    #gameover {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 20;
      text-align: center;
    }
    #gameover h1 {
      font-size: 2.2rem;
      color: #ff2d95;
      margin-bottom: 12px;
      text-shadow: 0 0 20px #ff2d95;
    }
    #gameover p { font-size: 1.2rem; margin: 6px 0; color: #ccc; }
    #gameover p span { color: #00f0ff; font-size: 1.5rem; }
    #gameover button {
      margin-top: 24px;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 700;
      background: transparent;
      color: #00f0ff;
      border: 2px solid #00f0ff;
      cursor: pointer;
      letter-spacing: 0.08em;
    }
    #gameover button:hover { background: #00f0ff; color: #000; }
    @media (max-width: 600px) {
      #mobile { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div>
      <div>SCORE <span id="score">0</span></div>
      <div>WAVE <span id="wave">1</span></div>
    </div>
    <div id="lives">❤️❤️❤️</div>
  </div>

  <div id="mobile">
    <button id="btnL">◀</button>
    <button id="btnS">🔥</button>
    <button id="btnR">▶</button>
  </div>

  <div id="gameover">
    <h1>MISSION FAILED</h1>
    <p>Score: <span id="fscore">0</span></p>
    <p>Wave: <span id="fwave">0</span></p>
    <button id="retry">↺ PLAY AGAIN</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Audio
    let actx = null;
    function audio() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); }
    function tone(f, type, d, v = 0.1) {
      if (!actx) return;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f; g.gain.value = v;
      o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime;
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.start(t); o.stop(t + d);
    }
    const sfx = {
      shoot: () => tone(880, 'square', 0.07, 0.05),
      hit: () => tone(150, 'sawtooth', 0.1, 0.08),
      boom: () => { tone(110, 'sawtooth', 0.25, 0.1); setTimeout(() => tone(70, 'sawtooth', 0.3, 0.07), 40); },
      boss: () => { tone(90, 'sawtooth', 0.18, 0.12); setTimeout(() => tone(55, 'square', 0.2, 0.09), 50); },
      spawn: () => [180,240,320,420,550].forEach((f,i) => setTimeout(() => tone(f,'sawtooth',0.18,0.09), i*70)),
      power: () => { tone(600,'sine',0.1,0.09); setTimeout(() => tone(900,'sine',0.12,0.09), 70); },
      over: () => [380,300,220,150].forEach((f,i) => setTimeout(() => tone(f,'sawtooth',0.28,0.09), i*140))
    };

    // State
    let score = 0, wave = 1, lives = 3, best = +localStorage.getItem('gaBest') || 0;
    let keys = {}, player, bullets = [], eBullets = [], enemies = [], particles = [], stars = [], powerups = [];
    let eTimer = 15, shootCD = 0, invuln = 0;
    let boss = null, bossOn = false, bossWave = 0;
    let left = false, right = false, shoot = false;
    let running = true;

    function makePlayer() {
      return { x: canvas.width/2, y: canvas.height - 70, w: 34, h: 38, spd: 6 };
    }
    function makeBullet(x, y, player = true, ang = 0) {
      const sp = player ? 12 : 4.2;
      return { x, y, w: player?3:5, h: player?12:8, player, vx: Math.sin(ang)*sp, vy: player ? -sp : Math.cos(ang)*sp };
    }
    function makeEnemy(type) {
      const T = [
        { w:30,h:26,hp:1,spd:1.6+wave*0.13,sc:10,c:'#ff2d95' },
        { w:40,h:34,hp:3,spd:1.0+wave*0.08,sc:30,c:'#ffcc00' },
        { w:24,h:20,hp:1,spd:2.5+wave*0.2,sc:15,c:'#00f0ff' },
        { w:32,h:28,hp:2,spd:1.8+wave*0.1,sc:20,c:'#9b5de5' },
        { w:34,h:30,hp:2,spd:1.3+wave*0.09,sc:35,c:'#00ff88' },
        { w:18,h:16,hp:1,spd:2.1+wave*0.15,sc:8,c:'#ff6b35' }
      ];
      const t = T[type%6];
      return {
        x: 40+Math.random()*(canvas.width-80), y: -30-Math.random()*50,
        ...t, type, vx:(Math.random()-0.5)*(type===3?3.2:1.3),
        st: 40+Math.random()*50, ang: 0
      };
    }
    function makeBoss() {
      sfx.spawn();
      const hp = 35 + wave*10;
      return { x: canvas.width/2, y: -100, w: 100, h: 75, hp, max: hp, sc: 500+wave*60, c:'#ff0044', vx:2, phase:1, st:35, entry:true };
    }
    function makePart(x,y,c) {
      return { x,y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, life:20+Math.random()*25, max:45, size:2+Math.random()*3.5, c };
    }
    function makeStars() {
      const s = [];
      for (let i=0;i<120;i++) s.push({
        x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        size: 0.6+Math.random()*2.4, spd: 0.5+Math.random()*1.8, a: 0.35+Math.random()*0.65
      });
      return s;
    }

    // Input
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['Space','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
      audio();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);
    canvas.addEventListener('mousedown', () => { shoot = true; audio(); });
    canvas.addEventListener('mouseup', () => shoot = false);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); shoot = true; audio(); }, {passive:false});
    canvas.addEventListener('touchend', () => shoot = false);

    document.getElementById('btnL').addEventListener('touchstart', e => { e.preventDefault(); left=true; audio(); });
    document.getElementById('btnL').addEventListener('touchend', () => left=false);
    document.getElementById('btnR').addEventListener('touchstart', e => { e.preventDefault(); right=true; audio(); });
    document.getElementById('btnR').addEventListener('touchend', () => right=false);
    document.getElementById('btnS').addEventListener('touchstart', e => { e.preventDefault(); shoot=true; audio(); });
    document.getElementById('btnS').addEventListener('touchend', () => shoot=false);

    function hud() {
      document.getElementById('score').textContent = score;
      document.getElementById('wave').textContent = wave + (bossOn ? ' ⚠ BOSS' : '');
      document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0,lives)) + '🖤'.repeat(Math.max(0,3-lives));
    }

    function start() {
      audio();
      resize();
      score=0; wave=1; lives=3;
      player = makePlayer();
      bullets=[]; eBullets=[]; enemies=[]; particles=[]; powerups=[];
      stars = makeStars();
      eTimer=12; invuln=0; boss=null; bossOn=false; bossWave=0;
      running=true;
      document.getElementById('gameover').style.display = 'none';
      hud();
    }

    function die() {
      running=false;
      sfx.over();
      if (score > best) { best=score; localStorage.setItem('gaBest', best); }
      document.getElementById('fscore').textContent = score;
      document.getElementById('fwave').textContent = wave;
      document.getElementById('gameover').style.display = 'flex';
    }

    document.getElementById('retry').addEventListener('click', start);

    function update() {
      if (!running) return;

      // Move
      let m = 0;
      if (keys['ArrowLeft']||keys['KeyA']||left) m=-1;
      if (keys['ArrowRight']||keys['KeyD']||right) m=1;
      player.x += m * player.spd;
      player.x = Math.max(18, Math.min(canvas.width-18, player.x));

      // Shoot
      if (shootCD>0) shootCD--;
      if ((keys['Space']||shoot) && shootCD<=0) {
        bullets.push(makeBullet(player.x, player.y-20));
        shootCD=10; sfx.shoot();
      }

      bullets.forEach(b => { b.x+=b.vx; b.y+=b.vy; });
      bullets = bullets.filter(b => b.y>-20);
      eBullets.forEach(b => { b.x+=b.vx; b.y+=b.vy; });
      eBullets = eBullets.filter(b => b.y<canvas.height+20);

      // Boss every 5 waves
      if (!bossOn && wave>=5 && wave%5===0 && bossWave!==wave && enemies.length<2) {
        boss = makeBoss(); bossOn=true; bossWave=wave; enemies=[]; hud();
      }

      // Spawn
      if (!bossOn) {
        eTimer--;
        if (eTimer<=0) {
          const r=Math.random();
          let t=0;
          if(r<0.12)t=5; else if(r<0.25)t=1; else if(r<0.4)t=2; else if(r<0.55)t=3; else if(r<0.7)t=4;
          if (t===5) {
            for(let i=0;i<3;i++){ const e=makeEnemy(5); e.x=50+Math.random()*(canvas.width-100); e.y=-20-i*30; enemies.push(e); }
          } else enemies.push(makeEnemy(t));
          eTimer = Math.max(14, 45-wave*2);
        }
      }

      // Enemies
      enemies.forEach(e => {
        e.y+=e.spd; e.x+=e.vx;
        if(e.type===3){ e.ang+=0.09; e.x+=Math.sin(e.ang)*2.3; }
        if(e.x<e.w/2||e.x>canvas.width-e.w/2) e.vx*=-1;
        if(e.type===4){
          e.st--;
          if(e.st<=0 && e.y>40 && e.y<canvas.height*0.6){
            eBullets.push(makeBullet(e.x, e.y+8, false, Math.atan2(player.x-e.x, player.y-e.y)));
            e.st=60+Math.random()*40;
          }
        }
      });

      // Boss
      if(bossOn && boss){
        if(boss.entry){ boss.y+=2.2; if(boss.y>=110) boss.entry=false; }
        else {
          boss.x+=boss.vx;
          if(boss.x<55||boss.x>canvas.width-55) boss.vx*=-1;
          if(boss.hp<boss.max*0.5) boss.phase=2;
          boss.st--;
          if(boss.st<=0){
            const n=boss.phase===2?5:3;
            for(let i=0;i<n;i++){
              const sp=(i-(n-1)/2)*0.32;
              eBullets.push(makeBullet(boss.x, boss.y+35, false, Math.PI+sp));
            }
            if(boss.phase===2) eBullets.push(makeBullet(boss.x, boss.y+20, false, Math.atan2(player.x-boss.x, player.y-boss.y)));
            boss.st = boss.phase===2 ? 28 : 48;
          }
        }
      }

      // Hits: player bullets → enemies
      for(let bi=bullets.length-1;bi>=0;bi--){
        const b=bullets[bi];
        for(let ei=enemies.length-1;ei>=0;ei--){
          const e=enemies[ei];
          if(b.x>e.x-e.w/2&&b.x<e.x+e.w/2&&b.y>e.y-e.h/2&&b.y<e.y+e.h/2){
            e.hp--; bullets.splice(bi,1); sfx.hit();
            for(let i=0;i<5;i++) particles.push(makePart(e.x,e.y,e.c));
            if(e.hp<=0){
              score+=e.sc; enemies.splice(ei,1); sfx.boom();
              for(let i=0;i<12;i++) particles.push(makePart(e.x,e.y,e.c));
              if(Math.random()<0.1) powerups.push({x:e.x,y:e.y,vy:2.3,type:Math.random()<0.6?'life':'score'});
              if(score>wave*140){ wave++; hud(); }
            }
            hud(); break;
          }
        }
      }

      // Hits: player bullets → boss
      if(bossOn&&boss){
        for(let bi=bullets.length-1;bi>=0;bi--){
          const b=bullets[bi];
          if(b.x>boss.x-boss.w/2&&b.x<boss.x+boss.w/2&&b.y>boss.y-boss.h/2&&b.y<boss.y+boss.h/2){
            boss.hp--; bullets.splice(bi,1); sfx.boss();
            for(let i=0;i<4;i++) particles.push(makePart(b.x,b.y,'#ff0044'));
            if(boss.hp<=0){
              score+=boss.sc; sfx.boom();
              for(let i=0;i<40;i++) particles.push(makePart(boss.x,boss.y,'#ff0044'));
              for(let i=0;i<15;i++) particles.push(makePart(boss.x,boss.y,'#ffcc00'));
              powerups.push({x:boss.x,y:boss.y,vy:1.5,type:'life'});
              powerups.push({x:boss.x-30,y:boss.y,vy:1.8,type:'score'});
              bossOn=false; boss=null; wave++; hud();
            }
            hud();
          }
        }
      }

      // Enemy bullets hit player
      if(invuln<=0){
        for(let i=eBullets.length-1;i>=0;i--){
          const b=eBullets[i];
          if(Math.abs(b.x-player.x)<16 && Math.abs(b.y-player.y)<20){
            lives--; invuln=90; eBullets.splice(i,1); sfx.boom();
            for(let p=0;p<14;p++) particles.push(makePart(player.x,player.y,'#00f0ff'));
            hud(); if(lives<=0) die();
          }
        }
      }

      // Enemies hit player
      if(invuln>0) invuln--;
      for(let ei=enemies.length-1;ei>=0;ei--){
        const e=enemies[ei];
        if(invuln<=0 && Math.abs(e.x-player.x)<(e.w+player.w)/2-5 && Math.abs(e.y-player.y)<(e.h+player.h)/2-5){
          lives--; invuln=90; sfx.boom();
          for(let i=0;i<16;i++) particles.push(makePart(player.x,player.y,'#00f0ff'));
          enemies.splice(ei,1); hud(); if(lives<=0) die();
        }
        if(e.y>canvas.height+40) enemies.splice(ei,1);
      }

      // Boss body hit
      if(bossOn&&boss&&invuln<=0&&!boss.entry){
        if(Math.abs(boss.x-player.x)<(boss.w+player.w)/2-10 && Math.abs(boss.y-player.y)<(boss.h+player.h)/2-10){
          lives--; invuln=100; sfx.boom();
          for(let i=0;i<18;i++) particles.push(makePart(player.x,player.y,'#ff0044'));
          hud(); if(lives<=0) die();
        }
      }

      // Powerups
      for(let i=powerups.length-1;i>=0;i--){
        const p=powerups[i]; p.y+=p.vy;
        if(Math.abs(p.x-player.x)<26 && Math.abs(p.y-player.y)<26){
          if(p.type==='life'&&lives<3){ lives++; sfx.power(); }
          else if(p.type==='score'){ score+=50; sfx.power(); }
          powerups.splice(i,1); hud();
        } else if(p.y>canvas.height) powerups.splice(i,1);
      }

      // Particles & stars
      particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--; p.vx*=0.94; p.vy*=0.94; });
      particles = particles.filter(p=>p.life>0);
      stars.forEach(s=>{ s.y+=s.spd*(bossOn?1.7:1); if(s.y>canvas.height){ s.y=0; s.x=Math.random()*canvas.width; } });
    }

    function drawShip(x,y) {
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle='#00f0ff'; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=14;
      ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(15,15); ctx.lineTo(5,9); ctx.lineTo(-5,9); ctx.lineTo(-15,15); ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(0,-3,3.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff6600';
      ctx.beginPath(); ctx.moveTo(-4,11); ctx.lineTo(0,22+Math.random()*7); ctx.lineTo(4,11); ctx.fill();
      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save(); ctx.translate(e.x,e.y);
      ctx.fillStyle=e.c; ctx.shadowColor=e.c; ctx.shadowBlur=10;
      if(e.type===1){ ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h); ctx.fillStyle='#222'; ctx.fillRect(-7,-7,14,14); }
      else if(e.type===2){ ctx.beginPath(); ctx.moveTo(0,-e.h/2); ctx.lineTo(e.w/2,0); ctx.lineTo(0,e.h/2); ctx.lineTo(-e.w/2,0); ctx.closePath(); ctx.fill(); }
      else if(e.type===3){ ctx.beginPath(); ctx.moveTo(0,-e.h/2); ctx.lineTo(e.w/2,-e.h/6); ctx.lineTo(e.w/3,e.h/2); ctx.lineTo(-e.w/3,e.h/2); ctx.lineTo(-e.w/2,-e.h/6); ctx.closePath(); ctx.fill(); }
      else if(e.type===4){ ctx.beginPath(); ctx.arc(0,0,e.w/2,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(0,3,5,0,Math.PI*2); ctx.fill(); }
      else if(e.type===5){ ctx.beginPath(); ctx.moveTo(0,e.h/2); ctx.lineTo(e.w/2,-e.h/2); ctx.lineTo(0,-e.h/4); ctx.lineTo(-e.w/2,-e.h/2); ctx.closePath(); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(0,e.h/2); ctx.lineTo(e.w/2,-e.h/2); ctx.lineTo(-e.w/2,-e.h/2); ctx.closePath(); ctx.fill(); }
      ctx.shadowBlur=0; ctx.restore();
    }

    function drawBoss(b) {
      ctx.save(); ctx.translate(b.x,b.y);
      ctx.shadowColor=b.c; ctx.shadowBlur=28;
      ctx.fillStyle=b.c;
      ctx.beginPath(); ctx.moveTo(0,-b.h/2); ctx.lineTo(b.w/2,-b.h/6); ctx.lineTo(b.w/2.4,b.h/2); ctx.lineTo(-b.w/2.4,b.h/2); ctx.lineTo(-b.w/2,-b.h/6); ctx.closePath(); ctx.fill();
      ctx.fillStyle=b.phase===2?'#ffcc00':'#ff6699';
      ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-20,-14,7,0,Math.PI*2); ctx.arc(20,-14,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(-20,-12,3.5,0,Math.PI*2); ctx.arc(20,-12,3.5,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      const w=90, pct=b.hp/b.max;
      ctx.fillStyle='#333'; ctx.fillRect(-w/2,-b.h/2-20,w,9);
      ctx.fillStyle=pct>0.5?'#00ff88':pct>0.25?'#ffcc00':'#ff0044';
      ctx.fillRect(-w/2,-b.h/2-20,w*pct,9);
      ctx.restore();
    }

    function draw() {
      ctx.fillStyle='#050510';
      ctx.fillRect(0,0,canvas.width,canvas.height);

      stars.forEach(s => {
        ctx.globalAlpha=s.a; ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha=1;

      particles.forEach(p => {
        ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.c;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha=1;

      ctx.fillStyle='#00f0ff'; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=8;
      bullets.forEach(b => ctx.fillRect(b.x-1.5,b.y,b.w,b.h));
      ctx.shadowBlur=0;

      ctx.fillStyle='#ff4466'; ctx.shadowColor='#ff4466'; ctx.shadowBlur=6;
      eBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x,b.y,4.5,0,Math.PI*2); ctx.fill(); });
      ctx.shadowBlur=0;

      enemies.forEach(drawEnemy);
      if(bossOn&&boss) drawBoss(boss);

      powerups.forEach(p => {
        ctx.fillStyle=p.type==='life'?'#00ff88':'#ffcc00';
        ctx.beginPath(); ctx.arc(p.x,p.y,12,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
        ctx.fillText(p.type==='life'?'+':'$', p.x, p.y+5);
      });

      if(running && (invuln<=0 || Math.floor(invuln/4)%2===0)) drawShip(player.x, player.y);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Start immediately
    start();
    loop();
  </script>
</body>
